[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nz-campervan-agent"
version = "1.0.0"
description = "KiwiCamp: Production-Grade 4-Week New Zealand Campervan Odyssey Multi-Agent System & Media-Rich Itinerary Website (AI in 5 Days L200 Assessment)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Orbitox" }
]
dependencies = [
    "google-adk[a2a]>=1.2.0",
    "google-cloud-aiplatform[agent_engines,adk,evaluation]>=1.129.0",
    "google-genai>=1.10.0",
    "google-cloud-secret-manager>=2.20.0",
    "google-cloud-dlp>=3.21.0",
    "google-cloud-trace>=1.13.0",
    "google-cloud-logging>=3.11.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-gcp-trace>=1.7.0",
    "pydantic>=2.9.0",
    "python-json-logger>=2.0.7",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "cloudpickle>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.agents-cli]
project_name = "nz-campervan-agent"
agent_template = "adk_a2a"
deployment_target = "agent_runtime"
region = "us-central1"
session_type = "agent_platform_sessions"
cicd_runner = "github_actions"
is_a2a = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
