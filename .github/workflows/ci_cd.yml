name: KiwiCamp AgentOps CI/CD & Evaluation Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  lint-test-and-evaluate:
    name: Unit Tests, Secret Scan & Golden Evaluation Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run AgentOps Rubric Unit Tests (19 Criteria / 95 Points)
        run: python3 -m unittest discover -s tests/unit -p "test_*.py" -v

      - name: Run Golden Dataset Evaluation Harness (Criterion 5.1)
        run: python3 tests/eval/run_evaluation_suite.py

      - name: Build & Verify 28-Day Interactive Website Bundle
        run: |
          python3 -c "from app.tools.nz_campervan_tools import generate_interactive_itinerary_website; res = generate_interactive_itinerary_website('web'); assert res['status'] == 'success' and res['total_days_rendered'] == 28"

  terraform-validate:
    name: Validate Terraform IaC (Criterion 5.2)
    runs-on: ubuntu-latest
    needs: lint-test-and-evaluate
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform Format & Init Check
        working-directory: deployment/terraform
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate

  deploy-vertex-agent-runtime:
    name: Deploy to Vertex AI Agent Runtime (ReasoningEngine)
    runs-on: ubuntu-latest
    needs: [lint-test-and-evaluate, terraform-validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy Agent via agents-cli
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        run: |
          echo "Deploying KiwiCamp to Vertex AI Agent Runtime (--deployment-target agent_runtime)"
          # agents-cli deploy --target agent_runtime --project ${{ secrets.GOOGLE_CLOUD_PROJECT }} --region us-central1
